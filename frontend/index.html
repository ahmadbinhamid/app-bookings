<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Booking</title>
    <style>
      /*
        Pure HTML/CSS placeholder, no JS dependency — covers the gap before
        React even mounts. In Vite dev mode that gap is not negligible: the
        dev server serves dozens of individual unbundled ES module requests
        rather than one bundle, so on a throttled connection #root can stay
        completely empty for 10+ seconds. A React-level Suspense/loading
        fallback can't help here since React hasn't executed yet — this has
        to be static markup already in the document. createRoot() replaces
        #root's children on its first commit, so this disappears the instant
        real content (even just the route's own skeleton) is ready.
      */
      #boot-skeleton {
        display: flex;
        height: 100vh;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      }
      #boot-skeleton .bs-nav {
        width: 220px;
        flex-shrink: 0;
        background: #ffffff;
        border-right: 1px solid #e4e4e7;
        padding: 20px 16px;
        box-sizing: border-box;
      }
      #boot-skeleton .bs-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: #f8f8fa;
      }
      #boot-skeleton .bs-header {
        height: 62px;
        flex-shrink: 0;
        background: rgba(255, 255, 255, 0.8);
        border-bottom: 1px solid #e4e4e7;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 32px;
        box-sizing: border-box;
      }
      #boot-skeleton .bs-content {
        flex: 1;
        padding: 24px 32px;
      }
      #boot-skeleton .bs-block {
        background: #e4e4e7;
        border-radius: 6px;
        animation: bs-pulse 1.4s ease-in-out infinite;
      }
      #boot-skeleton .bs-nav .bs-block {
        height: 14px;
        margin-bottom: 18px;
      }
      #boot-skeleton .bs-nav .bs-block:nth-child(1) { width: 60%; }
      #boot-skeleton .bs-nav .bs-block:nth-child(2) { width: 85%; }
      #boot-skeleton .bs-nav .bs-block:nth-child(3) { width: 75%; }
      #boot-skeleton .bs-header .bs-block:first-child { width: 90px; height: 12px; }
      #boot-skeleton .bs-header .bs-block:last-child { width: 160px; height: 34px; border-radius: 8px; }
      #boot-skeleton .bs-content .bs-block:first-child { width: 160px; height: 28px; margin-bottom: 20px; }
      #boot-skeleton .bs-content .bs-block:last-child { width: 100%; height: 380px; border-radius: 10px; }
      @keyframes bs-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      @media (prefers-color-scheme: dark) {
        #boot-skeleton .bs-nav { background: #1b1e26; border-color: #2a2e38; }
        #boot-skeleton .bs-main { background: #14161c; }
        #boot-skeleton .bs-header { background: rgba(27, 30, 38, 0.8); border-color: #2a2e38; }
        #boot-skeleton .bs-block { background: #2a2e38; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-skeleton">
        <div class="bs-nav">
          <div class="bs-block"></div>
          <div class="bs-block"></div>
          <div class="bs-block"></div>
        </div>
        <div class="bs-main">
          <div class="bs-header">
            <div class="bs-block"></div>
            <div class="bs-block" style="margin-left: auto;"></div>
          </div>
          <div class="bs-content">
            <div class="bs-block"></div>
            <div class="bs-block"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
